name: Publish build for cPanel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export (root path, for cPanel)
        run: npm run build

      - name: Add cPanel deployment file
        run: cp .cpanel.yml out/.cpanel.yml


      - name: Checkout existing deployment branch
        uses: actions/checkout@v4
        with:
          ref: cpanel-deploy
          path: deployment

      - name: Update deployment branch
        run: |
          rsync -a --delete --exclude='.git/' out/ deployment/

          cd deployment
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No deployment changes detected"
          else
            git commit -m "Deploy build from ${{ github.sha }}"
            git push origin HEAD:cpanel-deploy
          fi
